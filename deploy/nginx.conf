# ============================================================
# 个人网站 Nginx 配置
# 放服务器：/etc/nginx/conf.d/interview.conf
# 改完后： sudo nginx -t && sudo systemctl reload nginx
# 说明：前端静态文件与后端 API 同源，浏览器只认 https://your-domain.com，
#       因此不用配 CORS，也不存在跨域问题（推荐上线方式）。
# ============================================================

# ---------- HTTP：全部跳转到 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 证书签发/续期用的校验路径，必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：静态站点 + 反向代理 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com www.your-domain.com;

    # 证书用 certbot 申请后自动写入，下面两行由 certbot --nginx 生成/维护
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端构建产物（npm run build 后的 dist 目录拷到这里）
    root /opt/interview/front;
    index index.html;

    access_log /var/log/nginx/interview.access.log;
    error_log  /var/log/nginx/interview.error.log;

    # gzip 压缩（文本类资源收益最大）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 静态资源长缓存：dist/assets/ 下的文件名自带 hash，可安全设为一年
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 后端接口：转发到本机 Spring Boot（8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 读取超时放宽一点：AI 分析是异步任务，普通接口不受影响
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # 不缓存接口响应
        proxy_buffering off;
    }

    # SPA 路由回退：Vue Router 用的 history 模式，刷新 /plaza、/notes/xxx 时必须落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全加固
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;
}
